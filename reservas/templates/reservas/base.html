{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}EduPlace Suite{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ESTILOS GLOBALES: Esto asegura que el encabezado siempre se vea oscuro y bonito en todas las páginas -->
    <style>
        :root {
            --brand-dark: #0a0f1d;
            --brand-glow: #60a5fa;
        }
        
        body {
            margin: 0;
            padding: 0;
        }

        .topbar {
            background-color: var(--brand-dark);
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Inter', sans-serif; /* Forzamos la tipografía en el header */
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: var(--brand-glow);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--brand-glow);
        }

        .btn-volver-base {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-volver-base:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
        @media (max-width: 600px) {
            .topbar {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            .btn-volver-base {
                width: 100%;
                text-align: center;
            }
        }
    </style>

    <!-- Aquí se inyectan los estilos extra (Bootstrap, FullCalendar, etc.) que pida cada página individualmente -->
    {% block css_extra %}{% endblock %}
</head>
<body>

    <!-- Esta barra superior aparecerá estructurada Y con diseño en todas partes -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-dot"></span>
            EduPlace Suite
        </div>
        <a href="{% url 'home' %}" class="btn-volver-base">
            ← Volver al inicio
        </a>
    </header>

    {% block content %}
    {% endblock %}

</body>
</html>
